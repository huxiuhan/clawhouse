name: pixel_house
title: 🏠 像素小屋
description: |
  为角色生成一个像素化的小屋场景。
  
  系统会分别生成：
  1. 像素化的角色形象
  2. 符合角色设定的像素化小屋背景
  3. 小屋内符合角色设定的小物件
  4. 将三者叠加成最终的完整场景
  
  这样可以让每个角色都有一个独特的、符合其设定的小屋。

examples:
  - name: "为关羽生成温暖小屋"
    input:
      character_name: "关羽"
      character_description: "忠义刚正，骄傲自负，勇猛无畏，重情守诺，喜欢研读《春秋》"
      room_style: "温暖"
  
  - name: "为敖丙生成神秘小屋"
    input:
      character_name: "敖丙"
      character_description: "龙王之子，冷酷高贵，强大神秘，海底王子，喜欢珍珠和宝石"
      room_style: "神秘"
  
  - name: "为哪吒生成梦幻小屋"
    input:
      character_name: "哪吒"
      character_description: "眼圈漆黑，两团发髻，痞气顽童，混天绫，风火轮，调皮捣蛋"
      room_style: "梦幻"

parameters:
  character_name:
    description: "角色名称"
    type: "string"
    required: true
  
  character_description:
    description: "角色设定描述（用于生成符合设定的小物件）"
    type: "string"
    required: true
  
  room_style:
    description: "小屋风格"
    type: "enum"
    enum: ["温暖", "神秘", "梦幻", "冒险", "学术"]
    default: "温暖"

output:
  description: "返回四个生成任务的UUID和最终的图像"
  fields:
    character_task_uuid: "像素化角色生成任务ID"
    room_task_uuid: "小屋背景生成任务ID"
    items_task_uuid: "小物件生成任务ID"
    final_task_uuid: "最终合成任务ID"
    artifacts: "生成的图像列表"
